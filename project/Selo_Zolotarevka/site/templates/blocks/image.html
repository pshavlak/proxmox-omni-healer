<div class="content-section container">
    <figure class="image-block">
        <img src="{{ block.config.src }}" alt="{{ block.config.alt|default('') }}" class="image-block__img" loading="lazy">
        {% if block.config.caption %}
            <figcaption class="image-block__caption">{{ block.config.caption }}</figcaption>
        {% endif %}
    </figure>
</div>
